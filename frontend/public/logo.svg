<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Envelope body -->
  <rect x="88" y="180" width="336" height="208" rx="18" fill="white"/>

  <!-- Envelope flap (open, folded back) -->
  <path d="M88,198 L256,120 L424,198" fill="url(#flap)" stroke="white" stroke-width="2"/>

  <!-- Envelope chevron (V crease) -->
  <path d="M106,198 L256,310 L406,198" fill="none" stroke="#c7d2fe" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Summary lines emerging from envelope -->
  <rect x="158" y="248" width="196" height="10" rx="5" fill="#a5b4fc" opacity="0.7"/>
  <rect x="158" y="272" width="148" height="10" rx="5" fill="#a5b4fc" opacity="0.5"/>
  <rect x="158" y="296" width="172" height="10" rx="5" fill="#a5b4fc" opacity="0.35"/>

</svg>
