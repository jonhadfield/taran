# Dependabot version updates.
#
# Security updates are enabled separately in the repository settings and raise
# PRs only for vulnerable dependencies. This file covers routine upgrades, so
# releases like a Next.js patch are offered before they turn into an advisory.
#
# Minor and patch bumps are grouped into one PR per ecosystem to keep the noise
# down; majors come through on their own, since they need reading.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      # The CLI generates the client, so the two halves have to move together.
      # Listed first because the first matching group wins: this keeps prisma
      # out of the minor-and-patch group at every semver level. PR #98 bumped
      # @prisma/client to 7 on its own and could not build.
      prisma:
        patterns:
          - prisma
          - "@prisma/client"
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Held at 7.0.1 (PR #49): later versions add rules that fail lint until
      # the call sites are fixed. It is also pinned in package.json overrides,
      # so a bump here would not take effect anyway. Unpin deliberately.
      - dependency-name: eslint-plugin-react-hooks
      # ESLint 10 changed the rule context API and eslint-plugin-react has not
      # caught up: it throws "contextOrFilename.getFilename is not a function"
      # on every file (PR #95). Minor and patch updates still come through.
      # Remove this once the plugin supports ESLint 10.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # typescript-eslint does not support TS 7.0 and refuses to load, so lint
      # cannot run at all (PR #102). The code itself type-checks fine under 7 —
      # it is only the lint toolchain that lags. Support is tracked in
      # typescript-eslint#10940; remove this once it lands.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(frontend)"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(backend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
